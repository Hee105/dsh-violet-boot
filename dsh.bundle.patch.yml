# dsh-violet-boot bundle layer.
# 当 profile 的 package.json 把 dsh-violet-boot 列进 dsh.profile.bundles
# 时自动挂载；loader 从 profile 的 node_modules 里按 name 解析本包。
# 想改动画参数，就解开下面的 config 块（键见插件 README）。
- insert:
    - id: violet-boot
      name: dsh-violet-boot
